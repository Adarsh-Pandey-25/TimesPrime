name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth: .node-version, so CI cannot drift from local.
          node-version-file: .node-version
          cache: npm

      - name: Install
        # ci, not install: fails loudly if package-lock.json is out of sync
        # rather than quietly resolving something different from local.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Includes the import-boundary rules (eslint.boundaries.mjs).
        run: npm run lint

      - name: Import boundaries
        # The transitive client-bundle check lint cannot do (architecture.md
        # rule 6). Reads `git ls-files`, so it needs the checkout above.
        run: npm run check:boundaries

      - name: Test
        run: npm run test:ci

      - name: Build
        # The build evaluates next.config.ts, which reads these. They are not
        # secrets and not used at runtime here; placeholders keep the build
        # deterministic without wiring real credentials into CI.
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
